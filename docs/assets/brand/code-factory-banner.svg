<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Code Factory — a tree-based collaboration platform for requirements, coding-agent teams, and humans">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E2C63"/>
      <stop offset="1" stop-color="#051430"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1060 150) scale(420 300)">
      <stop stop-color="#20D7BA" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#20D7BA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B4A99"/>
      <stop offset="1" stop-color="#0A2350"/>
    </linearGradient>
    <linearGradient id="factory" x1="13" y1="17" x2="52" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3BE8CC"/>
      <stop offset="1" stop-color="#0BB39A"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1280" height="360" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#dots)"/>
    <rect width="1280" height="360" fill="url(#glow)"/>
  </g>

  <!-- Mark -->
  <g transform="translate(72 84) scale(1.75)">
    <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#tile)" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <path d="M13 48V17L26 27V17L39 27V17L52 27V48Z" fill="url(#factory)" stroke="url(#factory)" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M32.5 32.5V38M22 43V40.5Q22 38 24.5 38H40.5Q43 38 43 40.5V43" stroke="#071D45" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="32.5" cy="32.5" r="3.1" fill="#071D45"/>
    <circle cx="22" cy="43" r="3.1" fill="#071D45"/>
    <circle cx="43" cy="43" r="3.1" fill="#071D45"/>
  </g>

  <!-- Wordmark -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="214" y="144" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#FFFFFF">Code Factory</text>
    <text font-size="21" fill="#A9BEDF">
      <tspan x="216" y="182">A tree-based collaboration platform for</tspan>
      <tspan x="216" y="210">requirements, coding-agent teams, and humans.</tspan>
    </text>

    <!-- Provider chips -->
    <g font-size="14" font-weight="600" fill="#CFE0F7">
      <rect x="72" y="252" width="76" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="110" y="273" text-anchor="middle">Codex</text>
      <rect x="158" y="252" width="118" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="217" y="273" text-anchor="middle">Claude Code</text>
      <rect x="286" y="252" width="122" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="347" y="273" text-anchor="middle">Native Agent</text>
      <rect x="418" y="252" width="108" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="472" y="273" text-anchor="middle">GitHub PRs</text>
    </g>

    <!-- Requirement tree -->
    <g stroke="#3BE8CC" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round">
      <path d="M908 180H990"/>
      <path d="M940 180Q950 180 950 170V110Q950 100 960 100H990"/>
      <path d="M940 180Q950 180 950 190V250Q950 260 960 260H990"/>
    </g>

    <rect x="768" y="158" width="140" height="44" rx="12" fill="url(#factory)"/>
    <text x="838" y="186" text-anchor="middle" font-size="16" font-weight="700" fill="#06224A">Requirement</text>

    <rect x="990" y="74" width="218" height="52" rx="12" fill="#0C2A5E" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="1008" y="96" font-size="15" font-weight="600" fill="#FFFFFF">Child requirement</text>
    <text x="1008" y="115" font-size="12.5" font-weight="500" fill="#9DB4D8">Agent · <tspan fill="#3BE8CC" font-weight="600">Codex</tspan></text>

    <rect x="990" y="154" width="218" height="52" rx="12" fill="#0C2A5E" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="1008" y="176" font-size="15" font-weight="600" fill="#FFFFFF">Child requirement</text>
    <text x="1008" y="195" font-size="12.5" font-weight="500" fill="#9DB4D8">Agent · <tspan fill="#3BE8CC" font-weight="600">Claude Code</tspan></text>

    <rect x="990" y="234" width="218" height="52" rx="12" fill="#0C2A5E" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="1008" y="256" font-size="15" font-weight="600" fill="#FFFFFF">Child requirement</text>
    <text x="1008" y="275" font-size="12.5" font-weight="500" fill="#9DB4D8">Agent · <tspan fill="#3BE8CC" font-weight="600">Native Agent</tspan></text>
  </g>
</svg>
